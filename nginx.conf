server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — App.jsx uses BrowserRouter, so any path that isn't a
    # real static file must still resolve to index.html and let
    # react-router handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
